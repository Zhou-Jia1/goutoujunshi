name: Android
on:
  push:
    paths: ['android/**', 'SKILL.md', 'references/**', 'evals/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'SKILL.md', 'references/**', 'evals/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r evals/requirements.txt
      - run: python -m unittest discover tests
      - run: python scripts/validate_skill.py
      - run: python scripts/validate_android_knowledge.py && python scripts/validate_evals.py
      - run: python scripts/check_android_boundaries.py
      - run: chmod +x gradlew && ./gradlew lint test assembleDebug
        working-directory: android
      - run: ./gradlew :core:designsystem:verifyRoborazziDebug :app:verifyRoborazziDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-jvm-and-screenshot-reports
          path: |
            android/**/build/reports/
            android/**/build/outputs/roborazzi/
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: |
            ./gradlew :app:assembleDebug connectedDebugAndroidTest
            python3 ../scripts/smoke_android_m1.py --serial emulator-5554 --apk app/build/outputs/apk/debug/app-debug.apk
            python3 ../scripts/smoke_android_import.py --serial emulator-5554 --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
