name: Android
on:
  push:
    paths: ['android/**', 'SKILL.md', 'references/**', 'evals/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'SKILL.md', 'references/**', 'evals/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r evals/requirements.txt
      - run: python -m unittest discover tests
      - run: python scripts/validate_skill.py
      - run: python scripts/validate_android_knowledge.py && python scripts/validate_evals.py
      - run: chmod +x gradlew && ./gradlew lint test assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
